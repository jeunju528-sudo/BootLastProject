name: Deploy to AWS Server
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 소스코드 체크
      - name: Checkout:repository
        uses: actions/checkout@v2
      #JDK 설정
      - name: setup JDK 21
        uses: actions/setup-java@v1
        with:
          java-version: '21'
      # gradle 권한 변경
      - name: Set gradlew permission
        run: |
          chmod +x ./gradlew
      # gradle build
      - name: Build with Gradlew
        run: ./gradlew clean build -x test
      # AWS 연결
      - name: Set SSH key permission
        run: |
          mkdir -p ~/.ssh
          echo "${{secrets.SERVER_SSH_KEY}}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      # ADD SSH Key
      - name: Add SSH Key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{secrets.SERVER_SSH_KEY}}
      # ADD known_hosts
      - name: Add Known hosts
        run: |
          ssh-keyscan -H ed25519 3.34.46.197 >> ~/.ssh/known_hosts
      # jar파일을 AWS 전송 => Doerker 이미지 생성
      - name: Deploy to Server with rsync
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" build/libs/*.jar ubuntu@3.34.46.197:~/app
      # 9090 포트 킬 -> container 삭제
      - name: Run command
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@3.34.46.197 << 'EOF'
            pkill -f 'java -jar' || true
            nohup java -jar ~/app/BootLastProject-0.0.1-SNAPSHOT.jar > log.txt > 2>&1 &
          EOF
    
