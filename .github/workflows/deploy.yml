name: Deploy With Docker to AWS Server
# 실행조건
on:
  push:
    branches:
      - main # main commit and push = [main,master]
jobs:
  deploy:
    # GitHub Actions가 제공하는 Ubuntu환경에서 실행
    # AWS EC2가 아니고 GitHub Actions에서 제공하는 임시로 사용하는 Ubuntu 환경에서 돌아가라고 설정
    runs-on: ubuntu-latest

    # 실행 순서 지정
    steps:
     #코드 체크 
     - name: Checkout:repository
       uses: actions/checkout@v4
     #JDK 설정 => SpringBoot 프로젝트를 build하기위해 jdk설정
     - name: SetUp JDK 21
       uses: actions/setup-java@v1
       with:
         distribution: 'temurin' # 가벼운 버전의 jdk를 사용하라고 지정
         java-version: '21'
     # 환경설정
     # DB 환경설정
     - name: DB enviroment setting
       run: |
         rm -f .env
         touch .env
         echo "DB_URL=${{}}" >> .env
     # Gradlew 권한 부여 
     - name: Set gradlew permission
       run: |
         chmod +x ./gradlew
     # Gradle Build 
     - name: Build with Gradlew
       run: ./gradlew clean build -x test
     # AWS 연결 
     - name: Set SSH key Permission
       run: |
         mkdir -p ~/.ssh
         echo "${{secrets.SERVER_SSH_KEY}}" > ~/.ssh/id_ed25519
         chmod 600 ~/.ssh/id_ed25519
     # ADD SSH Key 
     - name: Add SSH Key 
       uses: webfactory/ssh-agent@v0.5.3
       with:
         ssh-private-key: ${{secrets.SERVER_SSH_KEY}}
     # Add Known_hosts
     - name: Add Known_hosts
       run: |
         ssh-keyscan -H ed25519 3.34.46.197 >> ~/.ssh/known_hosts
     # Jar파일을 AWS 전송 => Docker이미지 
     - name: Deploy to Server with rsync 
       run: |
         rsync -avz -e "ssh -o StrictHostKeyChecking=no" build/libs/*.jar ubuntu@3.34.46.197:~/app
     # 9090 포트 Kill => container 삭제 
     - name: Run command 
       run: |
         ssh -i ~/.ssh/id_ed25519 ubuntu@3.34.46.197 << 'EOF'
           pkill -f 'java -jar' || true
           cd ~/app
           set -a
           source .env
           set +a
           nohup java -jar ~/app/BootLastProject-0.0.1-SNAPSHOT.jar > log.txt 2>&1 &
         EOF
     # 9090 포트 다시 구동 => docker run
